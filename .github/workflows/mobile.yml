name: Mobile Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.7

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Libraries
        run: bash .github/scripts/install-libs.sh

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Setup Signing
        run: |
          KEYSTORE="$RUNNER_TEMP/ci.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android -alias tricky -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VsTricky,O=BrenninhoTools,C=BR"
          mkdir -p export/release/android/bin/app
          printf 'KEY_STORE=%s\nKEY_STORE_PASSWORD=android\nKEY_STORE_ALIAS=tricky\nKEY_STORE_ALIAS_PASSWORD=android\n' "$KEYSTORE" > export/release/android/bin/app/signing.properties

      - name: Build
        run: haxelib run lime build android -final
        env:
          ANDROID_GRADLE_TASK: assembleRelease

      - name: Collect APK
        run: |
          APK=$(find export/release/android/bin/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi
          mkdir -p dist
          cp "$APK" dist/VsTricky.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VsTricky-Android
          path: dist/VsTricky.apk
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neko Library
        run: |
          curl -sSL -o "$RUNNER_TEMP/neko.tar.gz" https://github.com/HaxeFoundation/neko/releases/download/v2-3-0/neko-2.3.0-osx64.tar.gz
          tar xzf "$RUNNER_TEMP/neko.tar.gz" -C "$RUNNER_TEMP"
          sudo mkdir -p /usr/local/lib
          sudo cp "$RUNNER_TEMP"/neko-2.3.0-osx64/*.dylib /usr/local/lib/

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Libraries
        run: bash .github/scripts/install-libs.sh

      - name: Disable Code Signing
        run: |
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGN_IDENTITY =\nDEVELOPMENT_TEAM =\n' > "$RUNNER_TEMP/nosign.xcconfig"
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/nosign.xcconfig" >> "$GITHUB_ENV"

      - name: Build
        run: haxelib run lime build ios -nosign -final

      - name: Package IPA
        run: |
          APP=$(ls -d export/release/ios/build/Release-iphoneos/*.app | head -n 1)
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qr VsTricky.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VsTricky-iOS
          path: dist/VsTricky.ipa
          if-no-files-found: error
