name: Android Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.7

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use All CPU Cores
        run: echo "HXCPP_COMPILE_THREADS=$(nproc)" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          local-cache: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache Haxelib
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ env.HAXE_VERSION }}-${{ hashFiles('.github/scripts/install-libs.sh') }}

      - name: Install Libraries
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/install-libs.sh

      - name: Use Cached Libraries
        if: steps.haxelib-cache.outputs.cache-hit == 'true'
        run: haxelib setup "$HOME/haxelib"

      - name: Cache Native Build
        uses: actions/cache@v4
        with:
          path: export/release/android/obj
          key: hxcpp-${{ runner.os }}-${{ hashFiles('.github/scripts/install-libs.sh') }}-${{ hashFiles('source/**', 'Project.xml') }}
          restore-keys: |
            hxcpp-${{ runner.os }}-${{ hashFiles('.github/scripts/install-libs.sh') }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('.github/scripts/install-libs.sh') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Setup Signing
        run: |
          KEYSTORE="$RUNNER_TEMP/ci.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android -alias tricky -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VsTricky,O=BrenninhoTools,C=BR"
          mkdir -p export/release/android/bin/app
          printf 'KEY_STORE=%s\nKEY_STORE_PASSWORD=android\nKEY_STORE_ALIAS=tricky\nKEY_STORE_ALIAS_PASSWORD=android\n' "$KEYSTORE" > export/release/android/bin/app/signing.properties

      - name: Build
        run: haxelib run lime build android -final
        env:
          ANDROID_GRADLE_TASK: assembleRelease

      - name: Collect APK
        run: |
          APK=$(find export/release/android/bin/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi
          mkdir -p dist
          cp "$APK" dist/VsTricky.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VsTricky-Android
          path: dist/VsTricky.apk
          if-no-files-found: error
          compression-level: 0

